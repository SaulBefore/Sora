name: Trigger auto deployment for itcontainerapp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ open-sora-v1.3-upload ]
    paths:
    - '**'
    - '.github/workflows/itcontainerapp-AutoDeployTrigger-e63b8e75-d867-4bcc-aa0f-8c3ded4067e7.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.ITCONTAINERAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ITCONTAINERAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ITCONTAINERAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.ITCONTAINERAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ITCONTAINERAPP_REGISTRY_PASSWORD }}
          containerAppName: itcontainerapp
          resourceGroup: App
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


